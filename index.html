<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#1b2430" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet" />
    <title>Tower Defense 3D</title>
  </head>
  <body>
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <symbol id="i-coin" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10" fill="#ffcf3f" stroke="#9a6a0c" stroke-width="2" />
        <circle cx="12" cy="12" r="5.6" fill="none" stroke="#e09e1c" stroke-width="2" />
        <path d="M7.6 8.2a5.6 5.6 0 0 1 3.6-2.5" fill="none" stroke="#fff4b8" stroke-width="2" stroke-linecap="round" />
      </symbol>
      <symbol id="i-heart" viewBox="0 0 24 24">
        <path d="M12 20.5s-7.6-4.5-9.5-9.2C1 7.7 3.2 4.3 6.7 4.3c2.2 0 3.6 1.2 5.3 3.2 1.7-2 3.1-3.2 5.3-3.2 3.5 0 5.7 3.4 4.2 7C19.6 16 12 20.5 12 20.5z" fill="#ff5d5d" stroke="#9c2329" stroke-width="1.8" stroke-linejoin="round" />
        <path d="M6.4 7.6c.6-.8 1.5-1.1 2.4-.9" fill="none" stroke="#ffc2c2" stroke-width="1.8" stroke-linecap="round" />
      </symbol>
      <symbol id="i-flag" viewBox="0 0 24 24">
        <path d="M5.5 3v18" stroke="#e8e2d4" stroke-width="2.4" stroke-linecap="round" />
        <path d="M6.5 4.2h11.8l-2.6 4 2.6 4H6.5z" fill="#a46bff" stroke="#4d2a8f" stroke-width="1.8" stroke-linejoin="round" />
      </symbol>
      <symbol id="i-ff" viewBox="0 0 24 24">
        <path d="M3 6.2l8 5.8-8 5.8zM12.5 6.2l8 5.8-8 5.8z" fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" />
      </symbol>
      <symbol id="i-play" viewBox="0 0 24 24">
        <path d="M7.5 4.8v14.4l11.6-7.2z" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round" />
      </symbol>
      <symbol id="i-swords" viewBox="0 0 24 24">
        <path d="M4 4l10 10M20 4L10 14M7.5 16.5l-3 3M16.5 16.5l3 3M6 14l4 4M18 14l-4 4" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" />
      </symbol>
      <symbol id="i-replay" viewBox="0 0 24 24">
        <path d="M4.5 12a7.5 7.5 0 1 0 2.3-5.4" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" />
        <path d="M4 3.8v4.6h4.6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
      </symbol>
      <symbol id="i-tower" viewBox="0 0 48 48">
        <rect x="27" y="14.5" width="15" height="6" rx="2" fill="#2d3138" transform="rotate(-18 27 17.5)" />
        <rect x="39" y="9.6" width="4" height="8" rx="1.2" fill="#e8b544" stroke="#7a5510" stroke-width="1.5" transform="rotate(-18 41 13.6)" />
        <path d="M13 27a11 10 0 0 1 22 0z" fill="#3f7cc9" stroke="#1d3c69" stroke-width="2.5" stroke-linejoin="round" />
        <rect x="12" y="26" width="24" height="15" rx="2" fill="#d8cfbf" stroke="#5b5146" stroke-width="2.5" />
        <rect x="12" y="30" width="24" height="3.5" fill="#8a5a3a" />
        <rect x="21" y="34.5" width="6" height="6.5" rx="1" fill="#4a3328" />
        <rect x="8.5" y="40" width="31" height="5" rx="1.6" fill="#8f8577" stroke="#5b5146" stroke-width="2.5" />
      </symbol>
      <symbol id="i-trophy" viewBox="0 0 48 48">
        <path d="M14 9h20v9a10 10 0 0 1-20 0z" fill="#ffcf3f" stroke="#8a5d08" stroke-width="2.6" stroke-linejoin="round" />
        <path d="M14 12H8.5a6 6 0 0 0 6.5 9M34 12h5.5a6 6 0 0 1-6.5 9" fill="none" stroke="#8a5d08" stroke-width="2.6" stroke-linecap="round" />
        <path d="M21 28h6v6h-6z" fill="#e09e1c" stroke="#8a5d08" stroke-width="2.4" stroke-linejoin="round" />
        <rect x="15" y="34" width="18" height="6" rx="2" fill="#8a5a3a" stroke="#4a2f1c" stroke-width="2.4" />
        <path d="M19 13v5" stroke="#fff4b8" stroke-width="2.4" stroke-linecap="round" />
      </symbol>
      <symbol id="i-shield" viewBox="0 0 48 48">
        <path d="M24 5l15 5.5v11c0 9.5-6.5 17-15 21-8.5-4-15-11.5-15-21v-11z" fill="#ff6a5a" stroke="#7d1d22" stroke-width="2.6" stroke-linejoin="round" />
        <path d="M25 9l-4 10 6 4-5 11" fill="none" stroke="#7d1d22" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
      </symbol>
      <symbol id="i-phone" viewBox="0 0 48 48">
        <rect x="14" y="4" width="20" height="40" rx="4" fill="none" stroke="currentColor" stroke-width="3" />
        <path d="M21 38h6" stroke="currentColor" stroke-width="3" stroke-linecap="round" />
      </symbol>
    </svg>

    <div id="app">
      <div id="scene"></div>
      <div id="damage" aria-hidden="true"></div>

      <div id="hud">
        <div class="bar top">
          <div class="stat gold" title="Gold"><svg class="ico"><use href="#i-coin" /></svg><span id="gold">0</span></div>
          <div class="stat lives" title="Lives"><svg class="ico"><use href="#i-heart" /></svg><span id="lives">0</span></div>
          <div class="stat wave" title="Wave"><svg class="ico"><use href="#i-flag" /></svg><span class="label">Wave</span><span id="wave">0/0</span></div>
          <span class="spacer"></span>
          <button id="btn-speed" class="btn speed-btn" aria-label="Game speed"><svg class="ico"><use href="#i-ff" /></svg><span id="speed-label">1×</span></button>
        </div>
        <div class="bar bottom">
          <button class="btn tower-btn" data-tower="basic" aria-label="Build cannon tower">
            <svg class="tower-art"><use href="#i-tower" /></svg>
            <span class="tower-info">
              <span class="name">Cannon</span>
              <span class="cost-wrap"><svg class="ico"><use href="#i-coin" /></svg><span class="cost">0</span></span>
            </span>
          </button>
          <span class="hint">Tap a grass tile to build</span>
          <span class="spacer"></span>
          <button id="btn-wave" class="btn primary wave-btn">
            <svg class="ico ico-play"><use href="#i-play" /></svg>
            <svg class="ico ico-busy"><use href="#i-swords" /></svg>
            <span class="wave-label">Start wave</span>
          </button>
        </div>
      </div>

      <div id="banner" aria-live="polite">
        <div class="banner-sub"></div>
        <div class="banner-title"></div>
      </div>

      <div id="overlay-end" class="overlay" hidden>
        <div class="panel end-panel">
          <svg class="end-badge badge-win"><use href="#i-trophy" /></svg>
          <svg class="end-badge badge-lose"><use href="#i-shield" /></svg>
          <div class="title">Game over</div>
          <div class="detail"></div>
          <div class="end-stats">
            <div class="end-stat"><svg class="ico"><use href="#i-flag" /></svg><span id="end-wave">0/0</span></div>
            <div class="end-stat"><svg class="ico"><use href="#i-heart" /></svg><span id="end-lives">0</span></div>
          </div>
          <button class="btn primary big"><svg class="ico"><use href="#i-replay" /></svg><span>Play again</span></button>
        </div>
      </div>

      <div id="rotate" class="overlay">
        <div class="panel">
          <svg class="rotate-icon"><use href="#i-phone" /></svg>
          <div class="title">Rotate your device</div>
          <div class="detail">This game plays in landscape.</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
